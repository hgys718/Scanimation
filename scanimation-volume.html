<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The scanimation strip as a space-time volume: two dimensions of space, one of time.">
<title>Scanimation Volume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Same paper-and-ink system as the strip; header and footer match it exactly. Deliberately single-theme. */
/* Layout: one window of the strip wide; time runs back in depth without end. The front face is now and plays as you move. */
:root {
  --paper: #FFFFFF;
  --ink: #15171A;
  --muted: #676C66;
  --rule: #D4D6D2;
  --accent: #0B78A6;

  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  display: grid; grid-template-rows: auto 1fr auto;
  overflow: hidden; font-family: var(--mono); font-size: 12px;
  -webkit-font-smoothing: antialiased;
}
header, footer {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  gap: 10px 20px; padding-inline: 16px; padding-block: 12px;
}
footer { color: var(--muted); font-variant-numeric: tabular-nums; }
h1 {
  margin: 0; font-family: var(--display); font-weight: 850; font-stretch: 70%;
  font-size: 22px; letter-spacing: -0.01em; text-transform: uppercase; line-height: 1;
}
.controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.group { display: flex; align-items: center; gap: 6px; }
.label { text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--ink); }
button { font: inherit; color: var(--ink); background: transparent; border: 0; cursor: pointer; padding: 5px 9px; line-height: 1.2; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { border: 1px solid var(--ink); }
/* Shared header: identical on both pages — title, view switch, then the page's own control and New strip. */
.brand { display: flex; align-items: center; gap: 14px; }
.seg a { color: var(--ink); text-decoration: none; padding: 5px 9px; line-height: 1.2; }
.seg a + a { border-left: 1px solid var(--ink); }
.seg a[aria-current="page"] { background: var(--ink); color: var(--paper); cursor: default; }
.seg a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:focus-visible, a.btn:focus-visible, #stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#stage {
  position: relative; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
#stage.dragging { cursor: grabbing; }
#view { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 46%; }
#world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.sheet { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; }
.edge { position: absolute; left: 0; top: 0; height: 1px; transform-origin: 0 0; background: linear-gradient(90deg, var(--ink), transparent); }
.now { position: absolute; left: 0; top: 0; box-sizing: border-box; border: 1px solid var(--ink); transform-origin: 0 0; pointer-events: none; }
.ax { position: absolute; left: 0; top: 0; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; transform-origin: 0 0; }

#hint {
  position: absolute; left: 50%; top: 50%; z-index: 3; pointer-events: none;
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--paper); color: var(--ink); border: 1px solid var(--ink);
  font-family: var(--mono); font-size: 12px; white-space: nowrap;
  opacity: 0; transform: translate(-50%, calc(-50% + 8px)); transition: opacity .18s ease, transform .18s ease;
}
#hint.show { opacity: 1; transform: translate(-50%, -50%); }
/* behind the hint: blur and dim the artwork so the message stands out */
#scrim { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .18s ease;
  background: rgba(21, 23, 26, .32); }
/* the blur is applied to the artwork itself (not a backdrop filter), so it works the same in every browser, 3D included */
#view { transition: filter .18s ease; }
#stage.hinting #view { filter: blur(6px); }
#scrim.show { opacity: 1; }
#hint .sep { color: var(--muted); }
kbd {
  font: 500 11px/1 var(--mono); display: inline-block; min-width: 20px; padding: 4px 5px; text-align: center;
  border: 1px solid var(--ink); border-bottom-width: 2px;
}
@media (prefers-reduced-motion: reduce) { #hint, #scrim { transition: none; } }
</style>

<header>
  <div class="brand">
    <h1>Scanimation</h1>
    <nav class="seg" aria-label="View">
      <a id="to-strip" href="index.html">Strip</a>
      <a id="to-volume" href="scanimation-volume.html" aria-current="page">Volume</a>
    </nav>
  </div>
  <div class="controls">
    <div class="group">
      <span class="label" id="frames-label">Frames / cycle</span>
      <div class="seg" role="group" aria-labelledby="frames-label" id="frames">
        <button type="button" data-v="3" aria-pressed="false" title="The three frames the strip interlaces">3</button>
        <button type="button" data-v="6" aria-pressed="false">6</button>
        <button type="button" data-v="12" aria-pressed="true">12</button>
      </div>
    </div>
    <button type="button" class="btn" id="reseed" title="Generate a new strip (R)">New strip</button>
  </div>
</header>

<main id="stage" tabindex="0" aria-label="The strip as a space-time volume: width and height are space, depth is time running back without end. Right arrow plays forward, left plays backward, up and down change speed, drag to turn it.">
  <div id="view"><div id="world"></div></div>
  <div id="scrim" aria-hidden="true"></div>
  <div id="hint" role="status" aria-live="polite">
    <span><kbd>←</kbd> <kbd>→</kbd> to play through time</span><span class="sep">/</span><span><kbd>↑</kbd> <kbd>↓</kbd> to change speed</span><span class="sep">/</span><span>drag to turn</span>
  </div>
</main>

<footer>
  <span id="dist">0.0 cm</span>
  <span id="speed" title="Playback speed. Up / Down to change." aria-live="polite"></span>
</footer>

<script>
(() => {
  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const distEl = document.getElementById('dist');
  const speedEl = document.getElementById('speed');
  const qs = new URLSearchParams(location.search);

  // x is in on-screen px along the strip. Tiles are generated at RES of their display size (the 3D view
  // never shows them full-size, and the time stack needs several frames per tile).
  const RES = .7;
  const S = { t: 0, X0: 0, seed: (+qs.get('seed') >>> 0) || ((Math.random() * 2 ** 32) >>> 0),
              NS: [3, 6, 12].includes(+qs.get('f')) ? +qs.get('f') : 12,
              Wd: 400, Hd: 380, W: 280, H: 266, T: 129, M: 32, dz: 20, L: 800, DX: 16, colors: {} };
  const cache = new Map();  // i -> { f: [canvas per frame], n: frames ready }
  const ready = i => { const c = cache.get(i); return !!c && c.n === S.NS; };

  // ---------- seeded random ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hash(a, b) { let h = (a ^ Math.imul((b | 0) + 0x9E3779B9, 0x85EBCA6B)) >>> 0; h = Math.imul(h ^ h >>> 16, 0x7FEB352D); h = Math.imul(h ^ h >>> 15, 0x846CA68B); return (h ^ h >>> 16) >>> 0; }
  const mod = (a, n) => ((a % n) + n) % n;

  const TAU = Math.PI * 2;
  const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); c.fill(); };

  // ---------- generators ----------
  // draw(c, U, h, p, k, P, fg, bg, L, R): home cell spans x∈[0,U]; the canvas shows x∈[L,R] so patterns can run into neighbours.
  const GENS = [
    { name: 'Orbit',
      setup: r => ({ n: 3 + (r() * 5 | 0), R: .27 + r() * .1, s: .045 + r() * .045, core: r() < .6, inner: r() < .55 }),
      draw(c, U, h, p, k, P) {
        const m = Math.min(U, h), cx = U / 2, cy = h / 2;
        if (P.core) circle(c, cx, cy, m * .09);
        for (let i = 0; i < P.n; i++) { const a = TAU * i / P.n + TAU / P.n * p - Math.PI / 2; circle(c, cx + Math.cos(a) * P.R * m, cy + Math.sin(a) * P.R * m, P.s * m); }
        if (P.inner) { const n = P.n + 2; for (let i = 0; i < n; i++) { const a = TAU * i / n - TAU / n * p; circle(c, cx + Math.cos(a) * P.R * .52 * m, cy + Math.sin(a) * P.R * .52 * m, P.s * .45 * m); } }
      } },
    { name: 'Polygon',
      setup: r => ({ n: 3 + (r() * 6 | 0), L: 2 + (r() * 3 | 0), dir: r() < .5 ? 1 : -1 }),
      draw(c, U, h, p, k, P, fg, bg) {
        const m = Math.min(U, h), cx = U / 2, cy = h / 2;
        for (let j = 0; j < P.L; j++) {
          const R = m * .42 * (1 - j * (.8 / P.L)); const rot = (j % 2 ? -1 : 1) * P.dir * TAU / P.n * p + j * .3;
          c.fillStyle = j % 2 ? bg : fg; c.beginPath();
          for (let i = 0; i < P.n; i++) { const a = rot + TAU * i / P.n - Math.PI / 2; c[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * R, cy + Math.sin(a) * R); }
          c.closePath(); c.fill();
        }
        c.fillStyle = fg;
      } },
    { name: 'Ripple',
      setup: r => ({ d: .07 + r() * .05, t: .38 + r() * .2, oy: (r() - .5) * .5 }),
      draw(c, U, h, p, k, P, fg, bg, L, R) {
        const m = Math.min(U, h), d = P.d * m, cx = U / 2, cy = h / 2 + P.oy * h;
        c.strokeStyle = fg; c.lineWidth = d * P.t; const max = Math.hypot(Math.max(cx - L, R - cx), h) + d;
        for (let r0 = d * p; r0 < max; r0 += d) { c.beginPath(); c.arc(cx, cy, Math.max(.1, r0), 0, TAU); c.stroke(); }
      } },
    { name: 'Bounce',
      setup: r => ({ R: .1 + r() * .05 }),
      draw(c, U, h, p, k, P) {
        const m = Math.min(U, h), R = P.R * m, floor = h * .8;
        const lift = [0, .5, .95][k], sx = [1.35, .82, 1][k], sy = [.7, 1.2, 1][k];
        const y = floor - R * sy - lift * h * .5;
        c.beginPath(); c.ellipse(U / 2, floor + m * .01, R * (1.3 - lift * .6), R * .14, 0, 0, TAU); c.fill();
        c.beginPath(); c.ellipse(U / 2, y, R * sx, R * sy, 0, 0, TAU); c.fill();
      } },
    { name: 'Swell',
      setup: r => ({ b: 6 + (r() * 7 | 0), A: .3 + r() * .5, lam: .5 + r() * .8, dir: r() < .5 ? 1 : -1 }),
      draw(c, U, h, p, k, P, fg, bg, L, R) {
        const sp = h / P.b; c.strokeStyle = fg; c.lineWidth = sp * .46; c.lineCap = 'round';
        for (let j = -1; j <= P.b + 1; j++) { c.beginPath(); for (let x = L - 10; x <= R + 10; x += 4) { const y = j * sp + sp / 2 + Math.sin(TAU * x / (P.lam * U) + TAU * p * P.dir + j * .4) * sp * P.A; x === L - 10 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); }
      } },
    { name: 'Clockwork',
      setup: r => { const cols = 2 + (r() * 3 | 0); const a = []; for (let i = 0; i < 64; i++) a.push({ b: r() * TAU, d: r() < .5 ? 1 : -1 }); return { cols, a }; },
      draw(c, U, h, p, k, P, fg, bg, L, R) {
        const cw = U / P.cols, rows = Math.max(1, Math.round(h / cw)), ch = h / rows, Rr = Math.min(cw, ch) * .38;
        c.strokeStyle = fg; c.lineCap = 'round';
        for (let y = 0; y < rows; y++) for (let x = Math.floor(L / cw) - 1; x <= Math.ceil(R / cw); x++) {
          const q = P.a[mod(x * 7 + y * 13, P.a.length)], cx = (x + .5) * cw, cy = (y + .5) * ch;
          c.lineWidth = Rr * .16; c.beginPath(); c.arc(cx, cy, Rr, 0, TAU); c.stroke();
          const a = q.b + q.d * TAU * p; c.lineWidth = Rr * .24;
          c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * Rr * .78, cy + Math.sin(a) * Rr * .78); c.stroke();
          circle(c, cx, cy, Rr * .18);
        }
      } },
    { name: 'Vortex',
      setup: r => ({ arms: 1 + (r() * 4 | 0), turns: 2.5 + r() * 2.5, dir: r() < .5 ? 1 : -1 }),
      draw(c, U, h, p, k, P, fg) {
        const m = Math.min(U, h), cx = U / 2, cy = h / 2, R = m * .48;
        c.strokeStyle = fg; c.lineCap = 'round'; c.lineWidth = R / (P.turns * P.arms) * .5;
        for (let a = 0; a < P.arms; a++) { c.beginPath(); const rot = TAU * a / P.arms + P.dir * TAU / P.arms * p;
          for (let t = 0; t <= 1; t += .004) { const ang = rot + t * P.turns * TAU, rr = t * R; const X = cx + Math.cos(ang) * rr, Y = cy + Math.sin(ang) * rr; t ? c.lineTo(X, Y) : c.moveTo(X, Y); }
          c.stroke(); }
      } },
    { name: 'Checker',
      setup: r => ({ n: 5 + (r() * 6 | 0), round: r() < .45, diag: r() < .6 }),
      draw(c, U, h, p, k, P, fg, bg, L, R) {
        const s = U / P.n, sh = 2 * s * p;
        for (let y = -2; y < h / s + 2; y++) for (let x = Math.floor(L / s) - 3; x < Math.ceil(R / s) + 2; x++) {
          if (mod(x + y, 2)) continue; const X = x * s + sh, Y = y * s + (P.diag ? sh : 0);
          if (P.round) circle(c, X + s / 2, Y + s / 2, s * .5); else c.fillRect(X, Y, s, s);
        }
      } },
    { name: 'Metronome',
      setup: r => ({ A: .5 + r() * .35, bob: .06 + r() * .03 }),
      draw(c, U, h, p, k, P, fg) {
        const m = Math.min(U, h), px = U / 2, py = h * .12, L = h * .66, a = Math.sin(TAU * p) * P.A;
        const bx = px + Math.sin(a) * L, by = py + Math.cos(a) * L;
        c.strokeStyle = fg; c.lineCap = 'round'; c.lineWidth = m * .03;
        c.beginPath(); c.moveTo(px, py); c.lineTo(bx, by); c.stroke();
        circle(c, px, py, m * .035); circle(c, bx, by, P.bob * m);
      } },
    { name: 'Letters',
      setup: r => { const W = ['RUN', 'YES', 'NOW', 'HEY', 'ONE', 'OUI', 'ZIP', 'POP', 'SEE', 'ART', 'FLY', 'GO!', 'WOW', 'OK?', '123', 'ABC', 'SUN', 'INK']; return { w: W[r() * W.length | 0] }; },
      draw(c, U, h, p, k, P) {
        const size = Math.min(U * 1.2, h * .82); c.font = `900 ${size}px Archivo, "Arial Black", sans-serif`;
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(P.w[k], U / 2, h / 2 + size * .04);
      } },
    { name: 'Morph',
      setup: r => ({ g: 1 + (r() * 3 | 0), rot: r() < .5 }),
      draw(c, U, h, p, k, P, fg, bg, L, R) {
        const s = U / P.g, rows = Math.max(1, Math.round(h / s)), sh = h / rows, Rr = Math.min(s, sh) * .36;
        for (let y = 0; y < rows; y++) for (let x = Math.floor(L / s) - 1; x <= Math.ceil(R / s); x++) {
          const cx = (x + .5) * s, cy = (y + .5) * sh, kk = mod(k + x + y, 3);
          c.save(); c.translate(cx, cy); if (P.rot) c.rotate(p * Math.PI / 2);
          if (kk === 0) circle(c, 0, 0, Rr * 1.05);
          else if (kk === 1) c.fillRect(-Rr * .92, -Rr * .92, Rr * 1.84, Rr * 1.84);
          else { c.beginPath(); for (let i = 0; i < 3; i++) { const a = -Math.PI / 2 + TAU * i / 3; c.lineTo(Math.cos(a) * Rr * 1.3, Math.sin(a) * Rr * 1.3 + Rr * .15); } c.fill(); }
          c.restore();
        }
      } },
    { name: 'Rose',
      setup: r => ({ n: [3, 5, 7, 4, 6][r() * 5 | 0], dir: r() < .5 ? 1 : -1, hole: r() < .6 }),
      draw(c, U, h, p, k, P, fg, bg) {
        const m = Math.min(U, h), cx = U / 2, cy = h / 2, R = m * .46, rot = P.dir * TAU / P.n * p;
        c.beginPath(); for (let t = 0; t <= TAU + .01; t += .01) { const rr = R * Math.abs(Math.cos(P.n / 2 * t)); c.lineTo(cx + Math.cos(t + rot) * rr, cy + Math.sin(t + rot) * rr); } c.fill();
        if (P.hole) { c.fillStyle = bg; circle(c, cx, cy, m * .06); c.fillStyle = fg; }
      } },
    { name: 'Pulse',
      setup: r => ({ n: 1 + (r() * 3 | 0) }),
      draw(c, U, h, p, k, P) {
        const m = Math.min(U, h);
        const heart = (cx, cy, s) => { c.save(); c.translate(cx, cy); c.scale(s, s); c.beginPath(); c.moveTo(0, .35); c.bezierCurveTo(-.9, -.25, -.45, -.95, 0, -.45); c.bezierCurveTo(.45, -.95, .9, -.25, 0, .35); c.fill(); c.restore(); };
        if (P.n === 1) heart(U / 2, h / 2 + m * .08, m * .6 * [.78, 1.08, .92][k]);
        else { const rows = P.n + 1, sh = h / rows; for (let i = 0; i < rows; i++) heart(U / 2, sh * (i + .55), Math.min(U * .5, sh * .75) * [.78, 1.08, .92][(k + i) % 3]); }
      } },
  ];

  const baseGen = j => hash(S.seed, j * 7 + 3) % GENS.length;
  function genIndex(i) { let g = baseGen(i); if (g === baseGen(i - 1)) g = (g + 1) % GENS.length; return g; }
  function motif(j) {
    const G = GENS[genIndex(j)], r = mulberry32(hash(S.seed, j));
    const P = G.setup(r); return { G, P, inv: false };
  }

  // ---------- rendering ----------
  // Same pipeline as the strip, except each frame of each tile is melted on its own instead of being interlaced.
  const scratch = document.createElement('canvas');
  const sctx = scratch.getContext('2d', { willReadFrequently: true });
  const workerSrc = `
    let C = null; const motifs = new Map(); let lut = null;
    const mod = (a, n) => ((a % n) + n) % n;
    // Signed distance field (px, + inside ink, − outside, clamped to ±M) for motif columns [c0,c1).
    const INF = 1e20;
    function edt1d(f, n, d, v, z) {
      let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
      for (let q = 1; q < n; q++) {
        let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
        k++; v[k] = q; z[k] = s; z[k + 1] = INF;
      }
      k = 0;
      for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; const dq = q - v[k]; d[q] = dq * dq + f[v[k]]; }
    }
    function edt(grid, w, h) {
      const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
      for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = grid[y * w + x]; edt1d(f, h, d, v, z); for (let y = 0; y < h; y++) grid[y * w + x] = d[y]; }
      for (let y = 0; y < h; y++) { const o = y * w; for (let x = 0; x < w; x++) f[x] = grid[o + x]; edt1d(f, w, d, v, z); for (let x = 0; x < w; x++) grid[o + x] = d[x]; }
    }
    function sdfCols(u8, c0, c1) {
      const { EW, H, M } = C, Mo = Math.max(6, M * .2); const xa = Math.max(0, c0 - M), xb = Math.min(EW, c1 + M), bw = xb - xa, N = bw * H;
      const din = new Float64Array(N), dout = new Float64Array(N);
      for (let y = 0; y < H; y++) { const so = y * EW + xa, o = y * bw; for (let x = 0; x < bw; x++) { const ink = lut[u8[so + x]] >= .5; din[o + x] = ink ? INF : 0; dout[o + x] = ink ? 0 : INF; } }
      edt(din, bw, H); edt(dout, bw, H);
      const buf = new Float32Array(N);
      for (let n = 0; n < N; n++) { let s = din[n] > 0 ? Math.sqrt(din[n]) - .5 : .5 - Math.sqrt(dout[n]); buf[n] = s > M ? M : s < -Mo ? -Mo : s; }
      return { buf, xa, bw };
    }
    // smooth value noise in strip coordinates, so the melt front wanders instead of running as a straight line
    function h2(x, y) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) ^ C.seed; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
    function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy; }
    function tile(i, K) {
      const { W, H, T, M, EW, slit, P, I } = C, pad = T + M;
      const A = motifs.get(i - 1), B = motifs.get(i), D = motifs.get(i + 1);
      const colOf = (j, x) => x + (i - j) * W + pad;
      const zl = [], zr = [];
      { const k = K;
        zl[k] = ([sdfCols(A[k], colOf(i - 1, 0), colOf(i - 1, T)), sdfCols(B[k], colOf(i, 0), colOf(i, T))]);
        zr[k] = ([sdfCols(B[k], colOf(i, W - T), colOf(i, W)), sdfCols(D[k], colOf(i + 1, W - T), colOf(i + 1, W))]);
      }
      const out = new Uint8ClampedArray(W * H * 4);
      for (let x = 0; x < W; x++) {
        const k = K;
        let mode = 0, t = 0, ca, cb, za, zb;
        if (x < T) { mode = 1; t = (x + T) / (2 * T); ca = colOf(i - 1, x); cb = colOf(i, x); [za, zb] = zl[k]; }
        else if (x >= W - T) { mode = 1; t = (x - (W - T)) / (2 * T); ca = colOf(i, x); cb = colOf(i + 1, x); [za, zb] = zr[k]; }
        const f = B[k], cc = colOf(i, x), gx = (i * W + x) / C.cell, env = Math.sin(Math.PI * t);
        const bxa = mode ? ca - za.xa : 0, bxb = mode ? cb - zb.xa : 0;
        for (let y = 0; y < H; y++) {
          let v;
          if (!mode) v = lut[f[y * EW + cc]];
          else {
            const gy = y / C.cell, n = vnoise(gx, gy) * .65 + vnoise(gx * 2.3 + 17, gy * 2.3) * .35;
            let tt = t + (n - .5) * 1.1 * env; tt = tt < 0 ? 0 : tt > 1 ? 1 : tt; const s = tt * tt * (3 - 2 * tt);
            const F = za.buf[y * za.bw + bxa] * (1 - s) + zb.buf[y * zb.bw + bxb] * s + .5; v = F <= 0 ? 0 : F >= 1 ? 1 : F; }
          const o = (y * W + x) * 4;
          out[o] = I[0]; out[o + 1] = I[1]; out[o + 2] = I[2]; out[o + 3] = 255 * v;   // ink on clear, so sheets stack
        }
      }
      return out;
    }
    onmessage = ({ data: m }) => {
      if (m.type === 'config') { C = m.C; motifs.clear(); lut = new Float32Array(256); for (let v = 0; v < 256; v++) { const q = (v - C.pv) / (C.iv - C.pv); lut[v] = q < 0 ? 0 : q > 1 ? 1 : q; } }
      else if (m.type === 'motif') { if (m.gen !== C.gen) return; motifs.set(m.j, m.frames); }
      else if (m.type === 'drop') { motifs.delete(m.j); }
      else if (m.type === 'tile') { if (m.gen !== C.gen) return;
        const missing = [m.i - 1, m.i, m.i + 1].filter(j => !motifs.has(j));
        if (missing.length) { postMessage({ gen: m.gen, i: m.i, k: m.k, missing }); return; }
        const px = tile(m.i, m.k); postMessage({ gen: m.gen, i: m.i, k: m.k, px }, [px.buffer]); }
    };`;
  const workerURL = URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' }));
  const NW = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 4) - 1));
  const HOLD = 6;
  let gen = 0; const motifStore = new Map(), pending = new Set();
  const pool = Array.from({ length: NW }, () => {
    const wk = { w: new Worker(workerURL), held: [], busy: false };
    wk.w.onmessage = ({ data }) => { wk.busy = false; onTile(wk, data); };
    return wk;
  });
  function onTile(wk, data) {
    if (data.gen !== gen) return; pending.delete(data.i + ':' + data.k);
    if (data.missing) { wk.held = wk.held.filter(j => !data.missing.includes(j)); return; }
    const cv = document.createElement('canvas'); cv.width = S.W; cv.height = S.H;
    cv.getContext('2d').putImageData(new ImageData(data.px, S.W, S.H), 0, 0);
    let c = cache.get(data.i); if (!c) { c = { f: [], n: 0 }; cache.set(data.i, c); }
    if (!c.f[data.k]) c.n++; c.f[data.k] = cv;
  }
  function pickWorker(need) {
    let best = null, score = -1;
    for (const wk of pool) { if (wk.busy) continue; const s = need.filter(j => wk.held.includes(j)).length; if (s > score) { best = wk; score = s; } }
    return best;
  }
  function dispatch(wk, i, k) {
    const need = [i - 1, i, i + 1];
    for (const j of need) {
      const at = wk.held.indexOf(j);
      if (at >= 0) { wk.held.splice(at, 1); wk.held.push(j); continue; }
      wk.w.postMessage({ type: 'motif', gen, j, frames: motifStore.get(j) });
      wk.held.push(j);
    }
    while (wk.held.length > HOLD) { const q = wk.held.findIndex(j => !need.includes(j)); wk.w.postMessage({ type: 'drop', j: wk.held[q] }); wk.held.splice(q, 1); }
    wk.w.postMessage({ type: 'tile', gen, i, k }); wk.busy = true; pending.add(i + ':' + k);
  }

  // Draw one frame of motif j per call. Frame k of NS is the moment p = k / NS of the motif's cycle;
  // with NS = 3 that is exactly the strip's three frames.
  let building = null;
  function stepMotif(j) {
    const { W, H, T, M, NS } = S, pad = T + M, EW = W + 2 * pad;
    if (!building || building.j !== j || building.gen !== gen) building = { j, gen, frames: [], m: motif(j) };
    const { G, P } = building.m, k = building.frames.length;
    const fg = S.colors.ink, bg = S.colors.paper, ch = S.colors.ch;
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.fillStyle = bg; sctx.fillRect(0, 0, EW, H);
    sctx.translate(pad, 0); sctx.fillStyle = fg; sctx.strokeStyle = fg;
    sctx.save(); G.draw(sctx, W, H, k / NS, Math.floor(3 * k / NS), P, fg, bg, -pad, W + pad); sctx.restore();
    const d = sctx.getImageData(0, 0, EW, H).data, u = new Uint8Array(EW * H);
    for (let n = 0, q = ch; n < u.length; n++, q += 4) u[n] = d[q];
    building.frames.push(u);
    if (building.frames.length === NS) { motifStore.set(j, building.frames); building = null; }
  }
  function configure() {
    gen++; motifStore.clear(); pending.clear(); building = null;
    const { W, H, T, M } = S, ch = S.colors.ch;
    scratch.width = W + 2 * (T + M); scratch.height = H;
    const C = { gen, W, H, T, M, slit: 3, seed: S.seed | 0, cell: Math.max(28, H * .2), EW: W + 2 * (T + M), pv: S.colors.prgb[ch], iv: S.colors.irgb[ch], P: S.colors.prgb, I: S.colors.irgb };
    for (const wk of pool) { wk.held = []; wk.w.postMessage({ type: 'config', C }); }
  }
  // Tiles in priority order; within a tile the front frame first.
  function request(order) {
    const t0 = performance.now(); let budget = true;
    for (const i of order) {
      if (ready(i)) continue;
      const need = [i - 1, i, i + 1];
      let miss = need.find(j => !motifStore.has(j));
      while (miss !== undefined && budget) { stepMotif(miss); budget = performance.now() - t0 < 5; miss = need.find(j => !motifStore.has(j)); }
      if (miss !== undefined) break;
      const c = cache.get(i);
      for (let k = 0; k < S.NS; k++) {
        if ((c && c.f[k]) || pending.has(i + ':' + k)) continue;
        const wk = pickWorker(need); if (!wk) return;
        dispatch(wk, i, k);
      }
    }
  }

  // ---------- layout ----------
  function parseColor(str) { scratch.width = Math.max(scratch.width, 2); sctx.setTransform(1,0,0,1,0,0); sctx.fillStyle = str; sctx.fillRect(0, 0, 1, 1); const d = sctx.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2]]; }
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    S.colors.ink = cs.getPropertyValue('--ink').trim(); S.colors.paper = cs.getPropertyValue('--paper').trim();
    S.colors.irgb = parseColor(S.colors.ink); S.colors.prgb = parseColor(S.colors.paper);
    const diffs = [0, 1, 2].map(c => Math.abs(S.colors.irgb[c] - S.colors.prgb[c]));
    S.colors.ch = diffs.indexOf(Math.max(...diffs));
  }
  // The box: one window of the strip wide, time running back in depth without end.
  // Sheet n is the moment n: the window has travelled n·DX along the strip and shows frame n of the motion.
  const PX_PER_CM = 37.795;
  // Depth is real time: each moment sits 1/speed seconds behind the one in front of it, so slow playback
  // spreads the frames far apart and fast playback packs them into a dense block.
  const VN_MAX = 140; let VN = 40;      // sheets in view behind "now" (as many as fit in the box's length)
  const dzFor = fps => S.Hd * .22 / fps;
  function layout() {
    const r = stage.getBoundingClientRect();
    S.Hd = Math.max(140, Math.round(Math.min(r.height * .42, r.width * .32)));
    S.Wd = Math.round(S.Hd * 1.05);
    S.L = S.Hd * 2.2;                  // visible length of the box (about 10 s of time at 1 frame/s… 0.4 s at 24)
    S.dz = dzFor(FPS_STEPS[fpsStep]);  // depth between consecutive moments
    S.DX = S.Wd / 24;                  // how far along the strip the window travels per moment
    S.H = Math.round(S.Hd * RES); S.W = Math.round(S.Wd * RES);
    S.T = Math.round(S.W * .46);
    S.M = Math.max(14, Math.round(Math.min(S.W, S.H) * .12));
  }
  const winX = n => S.X0 + n * S.DX;                         // left edge of the window at moment n (display px)
  const frameOf = n => mod(n, S.NS);
  const tilesFor = n => { const x = winX(n); return [Math.floor(x / S.Wd), Math.floor((x + S.Wd - 1) / S.Wd)]; };
  const sheetReady = n => { const [a, b] = tilesFor(n); for (let i = a; i <= b; i++) if (!ready(i)) return false; return true; };

  // ---------- sheets ----------
  const sheets = new Map();            // n -> canvas in the scene
  function makeSheet(n) {
    const cv = document.createElement('canvas'); cv.width = S.W; cv.height = S.H;
    cv.className = 'sheet'; cv.style.width = S.Wd + 'px'; cv.style.height = S.Hd + 'px';
    const c = cv.getContext('2d'), x = winX(n), k = frameOf(n), sc = S.W / S.Wd, [a, b] = tilesFor(n);
    for (let i = a; i <= b; i++) c.drawImage(cache.get(i).f[k], (i * S.Wd - x) * sc, 0, S.W, S.H);
    world.appendChild(cv); sheets.set(n, cv); return cv;
  }
  function buildBox() {
    world.querySelectorAll('.edge, .ax, .now').forEach(e => e.remove());
    const hw = S.Wd / 2, hh = S.Hd / 2, zf = S.L / 2;
    // four long edges running back in time, fading into the distance
    for (const x of [-hw, hw]) for (const y of [-hh, hh]) {
      const e = document.createElement('div'); e.className = 'edge'; e.style.width = S.L + 'px';
      e.style.transform = `translate3d(${x}px,${y}px,${zf}px) rotateY(90deg)`; world.appendChild(e);
    }
    const now = document.createElement('div'); now.className = 'now';
    now.style.width = S.Wd + 'px'; now.style.height = S.Hd + 'px';
    now.style.transform = `translate3d(${-hw}px,${-hh}px,${zf}px)`; world.appendChild(now);
    const lab = (t, tr) => { const s = document.createElement('span'); s.className = 'ax'; s.textContent = t; s.style.transform = tr; world.appendChild(s); };
    lab('x · space', `translate3d(${-hw}px,${hh + 10}px,${zf}px)`);
    lab('now', `translate3d(${-hw}px,${-hh - 22}px,${zf}px)`);
    lab('t · time →', `translate3d(${hw}px,${hh + 10}px,${zf}px) rotateY(90deg) translateX(${S.L * .12}px)`);
  }
  function rebuild() {
    for (const el of sheets.values()) el.remove();
    sheets.clear(); cache.clear();
    configure(); buildBox();
  }

  // ---------- camera ----------
  const cam = { yaw: -38, pitch: -16 };
  function applyCamera() { world.style.transform = `rotateX(${cam.pitch}deg) rotateY(${cam.yaw}deg)`; }

  // ---------- time ----------
  const FPS_STEPS = [1, 2, 3, 4, 6, 8, 12, 16, 24];          // moments per second
  let fpsStep = FPS_STEPS.indexOf(4);
  function showSpeed() { speedEl.textContent = `Speed ${FPS_STEPS[fpsStep]} frames/s  ↑↓`; }
  showSpeed();
  const DECEL = .004;                  // frames/tick² safety brake, only felt if generation falls behind
  // how many moments ahead (or behind) are ready to show, counted from now
  function runway(dir) {
    const n0 = Math.floor(S.t); let m = 0;
    if (dir > 0) { while (m < VN * 2 && sheetReady(n0 + m + 1)) m++; return Math.max(0, n0 + m - (S.t + VN * .5)); }
    while (m < 8 && sheetReady(n0 - m - 1)) m++; return Math.max(0, S.t - (n0 - m + 1));
  }
  const keys = new Set();
  let vel = 0, lastT = performance.now();
  function tick(now = performance.now()) {
    const dt = Math.min(3, Math.max(.25, (now - lastT) / 16.667)); lastT = now;
    S.dz += (dzFor(FPS_STEPS[fpsStep]) - S.dz) * (1 - Math.pow(.86, dt));   // spacing eases when the speed changes
    VN = Math.min(VN_MAX, Math.ceil(S.L / S.dz));
    GHOST = 1 - Math.pow(.72, S.dz / (S.Hd * .055));                          // same darkness per unit of depth, however dense
    const k = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
    const want = k * FPS_STEPS[fpsStep] / 60 * dt;          // moments this tick
    vel += (want - vel) * (1 - Math.pow(.72, dt));
    if (Math.abs(vel) < 1e-4 && !want) vel = 0;
    if (vel) {
      const lim = Math.sqrt(2 * DECEL * runway(Math.sign(vel))) * dt;
      S.t += Math.max(-lim, Math.min(lim, vel));
    }

    // generate the tiles the next stretch of time will pass over (ahead first)
    const n0 = Math.floor(S.t), dir = vel < 0 ? -1 : 1;
    const [a0] = tilesFor(n0 - 6), [, b0] = tilesFor(n0 + VN + 24);
    const order = []; for (let i = a0; i <= b0; i++) order.push(i);
    order.sort((p, q) => Math.abs(p - tilesFor(n0)[0]) - Math.abs(q - tilesFor(n0)[0]));
    request(order);
    for (const key of cache.keys()) if (key < a0 - 2 || key > b0 + 2) cache.delete(key);
    for (const j of motifStore.keys()) if (j < a0 - 3 || j > b0 + 3 || (ready(j - 1) && ready(j) && ready(j + 1))) motifStore.delete(j);

    // place the sheets: n at depth (n - t), the one at the front fades out as the next arrives
    for (const [n, el] of sheets) if (n < n0 || n > n0 + VN) { el.remove(); sheets.delete(n); }
    const zf = S.L / 2;
    for (let n = n0; n <= n0 + VN; n++) {
      let el = sheets.get(n);
      if (!el) { if (!sheetReady(n)) continue; el = makeSheet(n); }
      const d = n - S.t;                                   // moments behind now
      let o;
      if (d < 1) o = 1 - d * (1 - GHOST);           // the next moment firms up as it arrives
      else o = GHOST * Math.max(0, 1 - d * S.dz / S.L) ** 1.4;
      if (n === n0) o = 1;                                 // the moment you're on is solid
      el.style.opacity = o.toFixed(3);
      el.style.transform = `translate3d(${-S.Wd / 2}px,${-S.Hd / 2}px,${zf - d * S.dz}px)`;
    }
    distEl.textContent = `Moment ${n0} · ${(winX(S.t) / PX_PER_CM).toFixed(1)} cm along the strip`;
    requestAnimationFrame(tick);
  }
  let GHOST = .2;

  // ---------- input ----------
  const hint = document.getElementById('hint'); let hintT;
  const scrim = document.getElementById('scrim');
  function showHint() { hint.classList.add('show'); scrim.classList.add('show'); stage.classList.add('hinting'); clearTimeout(hintT); hintT = setTimeout(hideHint, 1800); }
  function hideHint() { clearTimeout(hintT); hint.classList.remove('show'); scrim.classList.remove('show'); stage.classList.remove('hinting'); }
  stage.addEventListener('wheel', e => { e.preventDefault(); if (Math.abs(e.deltaX) + Math.abs(e.deltaY) >= .5) showHint(); }, { passive: false });
  let drag = null;
  stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); stage.classList.add('dragging'); drag = { x: e.clientX, y: e.clientY }; });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    cam.yaw = Math.max(-85, Math.min(85, cam.yaw + (e.clientX - drag.x) * .25));
    cam.pitch = Math.max(-70, Math.min(70, cam.pitch - (e.clientY - drag.y) * .25));
    drag.x = e.clientX; drag.y = e.clientY; applyCamera();
  });
  const end = () => { drag = null; stage.classList.remove('dragging'); };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);

  const centreJ = () => Math.floor((winX(S.t) + S.Wd / 2) / S.Wd);
  function reseed() { S.seed = (Math.random() * 2 ** 32) >>> 0; S.t = 0; S.X0 = 0; vel = 0; rebuild(); }
  document.getElementById('reseed').addEventListener('click', reseed);
  document.getElementById('frames').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const j = centreJ(); S.NS = +b.dataset.v; document.querySelectorAll('#frames button').forEach(x => x.setAttribute('aria-pressed', x === b));
    S.t = Math.floor(S.t); rebuild();
  });
  document.getElementById('to-volume').addEventListener('click', e => e.preventDefault());
  document.getElementById('to-strip').addEventListener('click', e => { e.currentTarget.href = `index.html?seed=${S.seed}&j=${centreJ()}`; });
  window.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('button, a') && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { keys.add(e.key); hideHint(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      fpsStep = Math.max(0, Math.min(FPS_STEPS.length - 1, fpsStep + (e.key === 'ArrowUp' ? 1 : -1)));
      showSpeed(); e.preventDefault();
    }
    else if (e.key === 'r' || e.key === 'R') reseed();
  });
  window.addEventListener('keyup', e => keys.delete(e.key));
  window.addEventListener('blur', () => keys.clear());

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const j = centreJ(); layout(); S.X0 = j * S.Wd - S.t * S.DX; rebuild(); }, 150); });

  function start() {
    readColors(); layout(); applyCamera();
    document.querySelectorAll('#frames button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.v === S.NS));
    const j = qs.get('j') !== null ? (+qs.get('j') | 0) : 0;
    S.t = 0; S.X0 = j * S.Wd;
    rebuild(); requestAnimationFrame(tick);
  }
  (document.fonts && document.fonts.load ? Promise.race([document.fonts.load('900 100px Archivo'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(start, start);
})();
</script>
